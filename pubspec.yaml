name: cda_inventory
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  image_picker: ^1.1.2
  firebase_storage: ^13.4.3
  path_provider: ^2.1.1
  # ── Reports module (PDF / Excel export) ──────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  url_launcher: ^6.3.2
  local_auth: ^3.0.1
  share_plus: ^13.2.0
  image: ^4.2.0
  # ── Drone In/Out overdue reminder (on-device, no Blaze plan needed) ──────
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_1024.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/fixed_assets.jpg
    - assets/images/inventory.jpg
    - assets/images/consumables.jpg
    - assets/images/drone_in_and_out.jpg
    - assets/images/invoice_list.jpg
    - assets/images/purchase_list.jpg
    - assets/images/search_products.jpg
    - assets/images/stock history.jpg
    - assets/images/stock out.jpg
    - assets/images/stock_management.jpg
    - assets/images/branch_inventory.jpg
    - assets/icons/app_icon_1024.png
    - assets/images/report.png
    - assets/images/bills.png
    - assets/images/cda_background.png
    - assets/images/splash.png
    - assets/images/waiting.png
    - assets/images/dashboard_hero_banner.png
    - assets/images/side_navigation.png
    - assets/images/pending.png
    - assets/images/skylynk.jpg
    - assets/images/new_product.png
    - assets/images/drone services.png
